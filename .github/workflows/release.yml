name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Project
        run: unzip BehtarSho-Android-Project-fixed.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.BEHTAR_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > behtarsho-release.jks

      - name: Build Release APK
        working-directory: behtarsho
        env:
          STORE_PASSWORD: ${{ secrets.BEHTAR_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.BEHTAR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: BehtarSho-Release
          path: behtarsho/app/build/outputs/apk/release/*.apk
